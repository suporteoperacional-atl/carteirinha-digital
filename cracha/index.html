<title>Crachá Digital</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;padding:2rem}
.state{display:flex;flex-direction:column;align-items:center;gap:1rem;color:rgba(255,255,255,.5);font-family:'Montserrat',sans-serif;font-size:13px;letter-spacing:1px;text-align:center}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.12);border-top-color:#c9a84c;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.badge{width:320px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.hdr{background:#0c0c0c;padding:18px 22px;display:flex;align-items:center;justify-content:center}
.hdr img{height:40px;filter:brightness(0) invert(1)}
.stripe{height:5px}
.t .stripe{background:linear-gradient(90deg,#16a34a,#22c55e)}
.c .stripe{background:linear-gradient(90deg,#2563eb,#60a5fa)}
.d .stripe{background:linear-gradient(90deg,#dc2626,#f87171)}
.body{padding:22px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:88px;height:88px;border-radius:50%;padding:3px;display:flex;align-items:center;justify-content:center}
.t .ring{background:linear-gradient(135deg,#16a34a,#86efac)}
.c .ring{background:linear-gradient(135deg,#2563eb,#93c5fd)}
.d .ring{background:linear-gradient(135deg,#dc2626,#fca5a5)}
.inner{width:100%;height:100%;border-radius:50%;background:#f3f4f6;overflow:hidden;display:flex;align-items:center;justify-content:center}
.initials{font-family:'Montserrat',sans-serif;font-weight:800;font-size:26px;color:#374151}
.pill{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-family:'Montserrat',sans-serif;font-size:8.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#fff;padding:3px 10px;border-radius:20px;white-space:nowrap;border:2px solid #fff}
.t .pill{background:#16a34a}.c .pill{background:#2563eb}.d .pill{background:#dc2626}
.nome{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:800;color:#111827;text-align:center;line-height:1.2}
.funcao{font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:2px;text-transform:uppercase;text-align:center;margin-top:3px}
.t .funcao{color:#16a34a}.c .funcao{color:#2563eb}.d .funcao{color:#dc2626}
.metas{display:flex;gap:10px;width:100%}
.meta{flex:1;background:#f9fafb;border-radius:10px;padding:8px 10px;text-align:center}
.mlabel{font-size:8.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#9ca3af;margin-bottom:2px}
.mval{font-family:'Montserrat',sans-serif;font-size:11.5px;font-weight:700;color:#1f2937}
.ftr{background:#0c0c0c;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
.cod-label{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.4)}
.cod-val{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:800;color:#c9a84c;letter-spacing:1px}
.slabel{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;padding:4px 14px;border-radius:20px}
.t .slabel{color:#16a34a;background:rgba(22,163,74,.12)}
.c .slabel{color:#2563eb;background:rgba(37,99,235,.12)}
.d .slabel{color:#dc2626;background:rgba(220,38,38,.12)}
</style>

function err(m){document.getElementById('app').innerHTML='<div class="state"><span style="font-size:2rem">⚠️</span><span>'+m+'</span></div>';}

function status(s){
  if(!s)return'c';
  const n=s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(n.includes('trabalh'))return't';
  if(n.includes('deslig'))return'd';
  return'c';
}
const SLABEL={t:'Trabalhando',c:'Cadastrado',d:'Desligado'};

function initials(n){
  if(!n)return'?';
  const p=n.trim().split(/\s+/);
  return p.length===1?p[0].slice(0,2).toUpperCase():(p[0][0]+p[p.length-1][0]).toUpperCase();
}

function fdate(v){
  if(!v)return'—';
  if(typeof v==='string'&&v.startsWith('Date(')){
    const p=v.replace('Date(','').replace(')','').split(',');
    return new Date(+p[0],+p[1],+p[2]).toLocaleDateString('pt-BR');
  }
  const n=parseFloat(v);
  if(!isNaN(n)){
    return new Date(Math.round((n-25569)*86400*1000)).toLocaleDateString('pt-BR',{timeZone:'UTC'});
  }
  return v;
}

async function load(){
  const id=new URLSearchParams(location.search).get('id');
  if(!id){err('Use: ?id=SEU_ID');return;}

  const q=encodeURIComponent("SELECT * WHERE A='"+id+"'");
  const url='https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?sheet='+TAB+'&tq='+q+'&tqx=out:json';

  try{
    const txt=await(await fetch(url)).text();
    const json=JSON.parse(txt.match(/\{[\s\S]*\}/)[0]);
    if(!json.table||!json.table.rows||!json.table.rows.length){err('Funcionário não encontrado.');return;}
    const c=json.table.rows[0].c;
    const g=(i)=>c[i]&&c[i].v!=null?(c[i].f||c[i].v):'';
    const d={codigo:g(1),funcao:g(2),cadastro:c[3]?fdate(c[3].v||c[3].f):'—',nome:g(4),status:g(12)};
    const st=status(d.status);
    const sl=SLABEL[st];
    const cod=d.codigo?'ATL-'+String(d.codigo).padStart(4,'0'):'—';
    document.getElementById('app').innerHTML=`
    <div class="wrap ${st}">
      <div class="badge">
        <div class="hdr"><img src="${LOGO}" alt="Atlântico Shopping"></div>
        <div class="stripe"></div>
        <div class="body">
          <div class="ring">
            <div class="inner"><div class="initials">${initials(d.nome)}</div></div>
            <span class="pill">${sl}</span>
          </div>
          <div style="text-align:center">
            <p class="nome">${d.nome}</p>
            <p class="funcao">${d.funcao}</p>
          </div>
          <div class="metas">
            <div class="meta"><p class="mlabel">Cadastro</p><p class="mval">${d.cadastro}</p></div>
            <div class="meta"><p class="mlabel">Função</p><p class="mval">${d.funcao}</p></div>
          </div>
        </div>
        <div class="ftr">
          <div><p class="cod-label">Código</p><p class="cod-val">${cod}</p></div>
        </div>
      </div>
      <span class="slabel">${sl}</span>
    </div>`;
  }catch(e){console.error(e);err('Erro ao carregar dados.');}
}
load();
</script>
