<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Crachá Digital — Atlântico Shopping</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:#f0f2f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Montserrat',sans-serif;
  padding:2rem 1rem;
}

/* ── ESTADO DE CARREGAMENTO / ERRO ── */
.state{
  display:flex;flex-direction:column;align-items:center;
  gap:1rem;color:#6b7280;font-size:13px;letter-spacing:1px;text-align:center;
}
.spin{
  width:38px;height:38px;
  border:3px solid #e5e7eb;
  border-top-color:#1B3A6B;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── WRAPPER ── */
.wrap{display:flex;flex-direction:column;align-items:center;gap:16px}

/* ── CRACHÁ ── */
.badge{
  width:280px;
  background:#ffffff;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  box-shadow:0 12px 40px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
}

/* ── VELAS TRIANGULARES — canto superior direito ── */
.sail-deco{
  position:absolute;top:0;right:0;
  width:150px;height:150px;
  pointer-events:none;z-index:1;
}
/* ── TRIÂNGULOS espelho — canto inferior esquerdo ── */
.bottom-deco{
  position:absolute;bottom:0;left:0;
  width:120px;height:110px;
  pointer-events:none;z-index:1;
}

/* ── HEADER com logo ── */
.badge-header{
  padding:20px 22px 10px 20px;
  position:relative;z-index:2;
}
.badge-logo{
  height:50px;width:auto;
  filter:brightness(0) saturate(100%) invert(20%) sepia(45%) saturate(600%) hue-rotate(190deg) brightness(70%);
}

/* ── FOTO ── */
.photo-section{
  display:flex;justify-content:center;
  padding:4px 20px 12px;
  position:relative;z-index:2;
}
.photo-frame{
  width:100px;height:100px;
  border-radius:50%;
  border:3px solid #1B3A6B;
  background:#E8EEF5;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.photo-frame.t{border-color:#16a34a}
.photo-frame.d{border-color:#9ca3af}
.photo-frame img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.photo-initials{font-size:28px;font-weight:900;color:#1B3A6B;letter-spacing:-1px}
.photo-initials.t{color:#16a34a}
.photo-initials.d{color:#9ca3af}

/* ── STATUS PILL ── */
.status-pill{
  align-self:center;
  font-size:8px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase;
  padding:4px 16px;border-radius:20px;
  margin-bottom:10px;
  position:relative;z-index:2;
}
.pill-t{background:#dcfce7;color:#16a34a}
.pill-c{background:#dbeafe;color:#1B3A6B}
.pill-d{background:#f3f4f6;color:#9ca3af}

/* ── LINHA TRICOLOR ── */
.tricolor{
  height:3px;margin:0 20px;
  background:linear-gradient(90deg,#C8102E 0%,#C9A84C 50%,#1B3A6B 100%);
  border-radius:2px;
  position:relative;z-index:2;
}
.tricolor.d{background:#d1d5db}

/* ── CAMPOS ── */
.fields{
  padding:14px 20px 8px;
  display:flex;flex-direction:column;gap:10px;
  position:relative;z-index:2;flex:1;
}
.field-block{border-bottom:0.5px solid #f3f4f6;padding-bottom:8px}
.field-label{
  font-family:'Inter',sans-serif;
  font-size:7px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;
  color:#9ca3af;margin-bottom:2px;
}
.field-value{font-size:13.5px;font-weight:800;color:#0D2137;line-height:1.2}
.field-value.sm{font-size:11.5px}
.field-value.gray{color:#9ca3af}
.two-col{display:flex;gap:12px}
.two-col .field-block{flex:1}

/* ── RODAPÉ ── */
.badge-footer{
  background:#0D2137;
  padding:11px 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:2;margin-top:8px;
}
.badge-footer.d{background:#6b7280}
.code-label{font-family:'Inter',sans-serif;font-size:7px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.4)}
.code-val{font-size:17px;font-weight:900;color:#C9A84C;letter-spacing:1px}
.code-val.d{color:#d1d5db}
.footer-tag{
  font-size:8px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.65);
}

/* ── STATUS LABEL EXTERNO ── */
.status-ext{
  font-size:10px;font-weight:700;
  letter-spacing:2.5px;text-transform:uppercase;
  padding:5px 16px;border-radius:20px;
}
.ext-t{color:#16a34a;background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.2)}
.ext-c{color:#1B3A6B;background:rgba(27,58,107,.08);border:1px solid rgba(27,58,107,.15)}
.ext-d{color:#9ca3af;background:rgba(156,163,175,.1);border:1px solid rgba(156,163,175,.2)}

@media(max-width:400px){.badge{width:260px}}
</style>
</head>

</div>

const FOTO_PROXY = 'https://script.google.com/macros/s/AKfycbw1l12xFX0EaKy4JuHNV38mchD2jHl96p4WF-DKk1fAYJf3tcYby06TuFD1pZnSun3w/exec';

const SAIL_TOP = `<svg class="sail-deco" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <polygon points="150,0 150,130 58,0" fill="#1B3A6B"/>
  <polygon points="150,0 150,84 100,0" fill="#C8102E"/>
  <polygon points="150,0 150,44 124,0" fill="#C9A84C"/>
</svg>`;

const SAIL_BOTTOM = `<svg class="bottom-deco" viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg">
  <polygon points="0,110 105,110 0,28" fill="#1B3A6B"/>
  <polygon points="0,110 66,110 0,57" fill="#C8102E"/>
  <polygon points="0,110 33,110 0,79" fill="#C9A84C"/>
</svg>`;

const SAIL_TOP_GRAY = `<svg class="sail-deco" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <polygon points="150,0 150,130 58,0" fill="#d1d5db"/>
  <polygon points="150,0 150,84 100,0" fill="#e5e7eb"/>
  <polygon points="150,0 150,44 124,0" fill="#f3f4f6"/>
</svg>`;

const SAIL_BOTTOM_GRAY = `<svg class="bottom-deco" viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg">
  <polygon points="0,110 105,110 0,28" fill="#d1d5db"/>
  <polygon points="0,110 66,110 0,57" fill="#e5e7eb"/>
  <polygon points="0,110 33,110 0,79" fill="#f3f4f6"/>
</svg>`;

function err(m){document.getElementById('app').innerHTML='<div class="state"><span style="font-size:2rem">⚠️</span><span>'+m+'</span></div>';}

function status(s){
  if(!s)return'c';
  const n=s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(n.includes('trabalh'))return't';
  if(n.includes('deslig'))return'd';
  return'c';
}
const SLABEL={t:'Trabalhando',c:'Cadastrado',d:'Desligado'};

function initials(n){
  if(!n)return'?';
  const p=n.trim().split(/\s+/);
  return p.length===1?p[0].slice(0,2).toUpperCase():(p[0][0]+p[p.length-1][0]).toUpperCase();
}

function fdate(v){
  if(!v)return'—';
  if(typeof v==='string'&&v.startsWith('Date(')){
    const p=v.replace('Date(','').replace(')','').split(',');
    return new Date(+p[0],+p[1],+p[2]).toLocaleDateString('pt-BR');
  }
  const n=parseFloat(v);
  if(!isNaN(n))return new Date(Math.round((n-25569)*86400*1000)).toLocaleDateString('pt-BR',{timeZone:'UTC'});
  return v;
}

async function loadFoto(path){
  if(!path||!path.trim())return;
  try{
    const url=FOTO_PROXY+'?file='+encodeURIComponent(path);
    const b64=(await(await fetch(url)).text()).trim();
    if(b64.length>200&&/^[A-Za-z0-9+/=]{4}/.test(b64)){
      const img=document.getElementById('badge-foto');
      const ini=document.getElementById('badge-ini');
      if(img){img.src='data:image/jpeg;base64,'+b64;img.style.display='block';if(ini)ini.style.display='none';}
    }
  }catch(e){console.warn('foto:',e);}
}

async function load(){
  const id=new URLSearchParams(location.search).get('id');
  if(!id){err('Parâmetro não informado.<br>Use: ?id=SEU_ID');return;}

  const q=encodeURIComponent("SELECT * WHERE A='"+id+"'");
  const url='https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?sheet='+TAB+'&tq='+q+'&tqx=out:json';

  try{
    const txt=await(await fetch(url)).text();
    const json=JSON.parse(txt.match(/\{[\s\S]*\}/)[0]);
    if(!json.table||!json.table.rows||!json.table.rows.length){err('Funcionário não encontrado.');return;}

    const c=json.table.rows[0].c;
    const g=(i)=>c[i]&&c[i].v!=null?(c[i].f||String(c[i].v)):'';

    const d={
      codigo:  g(1),
      funcao:  g(2),
      cadastro:c[3]?fdate(c[3].v||c[3].f):'—',
      nome:    g(4),
      cpf:     g(5),
      rg:      g(6),
      foto:    g(10),
      status:  g(12),
    };

    const st  = status(d.status);
    const sl  = SLABEL[st];
    const cod = d.codigo?'ATL-'+String(d.codigo).padStart(4,'0'):'—';
    const isD = st==='d';

    const docCard = d.cpf&&d.cpf.trim()
      ? `<div class="field-block"><p class="field-label">CPF</p><p class="field-value sm${isD?' gray':''}">${d.cpf}</p></div>`
      : d.rg&&d.rg.trim()
      ? `<div class="field-block"><p class="field-label">RG</p><p class="field-value sm${isD?' gray':''}">${d.rg}</p></div>`
      : '';

    document.getElementById('app').innerHTML=`
    <div class="wrap">
      <div class="badge">
        ${isD?SAIL_TOP_GRAY:SAIL_TOP}
        ${isD?SAIL_BOTTOM_GRAY:SAIL_BOTTOM}

        <div class="badge-header">
          <img class="badge-logo" src="${LOGO}" alt="Atlântico Shopping"
            style="${isD?'filter:grayscale(1) opacity(0.4)':''}">
        </div>

        <div class="photo-section">
          <div class="photo-frame ${st}">
            <img id="badge-foto" style="display:none" alt="${d.nome}">
            <div id="badge-ini" class="photo-initials ${st}">${initials(d.nome)}</div>
          </div>
        </div>

        <span class="status-pill pill-${st}">● ${sl}</span>
        <div class="tricolor ${st==='d'?'d':''}"></div>

        <div class="fields">
          <div class="field-block">
            <p class="field-label">Nome</p>
            <p class="field-value${isD?' gray':''}">${d.nome}</p>
          </div>
          <div class="field-block">
            <p class="field-label">Função</p>
            <p class="field-value sm${isD?' gray':''}">${d.funcao}</p>
          </div>
          <div class="two-col">
            <div class="field-block">
              <p class="field-label">Cadastro</p>
              <p class="field-value sm${isD?' gray':''}">${d.cadastro}</p>
            </div>
            ${docCard}
          </div>
        </div>

        <div class="badge-footer ${isD?'d':''}">
          <div>
            <p class="code-label">Código</p>
            <p class="code-val ${isD?'d':''}">${cod}</p>
          </div>
          <p class="footer-tag">${d.funcao}</p>
        </div>
      </div>
      <span class="status-ext ext-${st}">● ${sl}</span>
    </div>`;

    if(d.foto)loadFoto(d.foto);

  }catch(e){console.error(e);err('Erro ao carregar dados.');}
}

load();
</script>
