<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Crachá Digital — Atlântico Shopping</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;padding:2rem 1rem;}
.state{display:flex;flex-direction:column;align-items:center;gap:1rem;color:#6b7280;font-size:13px;letter-spacing:1px;text-align:center;}
.spin{width:38px;height:38px;border:3px solid #e5e7eb;border-top-color:#1B3A6B;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.badge{width:280px;background:#ffffff;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 12px 40px rgba(0,0,0,0.15),0 2px 8px rgba(0,0,0,0.08);display:flex;flex-direction:column;}
.sail-deco{position:absolute;top:0;right:0;width:150px;height:150px;pointer-events:none;z-index:1;}
.bottom-deco{position:absolute;bottom:0;left:0;width:120px;height:110px;pointer-events:none;z-index:1;}
.badge-header{padding:18px 20px 10px 18px;position:relative;z-index:2;background:#fff;}
.badge-logo{height:44px;width:auto;display:block;}
.photo-section{display:flex;justify-content:center;padding:4px 20px 12px;position:relative;z-index:2;}
.photo-frame{width:100px;height:100px;border-radius:50%;border:3px solid #1B3A6B;background:#E8EEF5;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.photo-frame.t{border-color:#16a34a}
.photo-frame.d{border-color:#9ca3af}
.photo-frame img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.photo-initials{font-size:28px;font-weight:900;color:#1B3A6B;letter-spacing:-1px}
.photo-initials.t{color:#16a34a}
.photo-initials.d{color:#9ca3af}
.status-pill{align-self:center;font-size:8px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:4px 16px;border-radius:20px;margin-bottom:10px;position:relative;z-index:2;}
.pill-t{background:#dcfce7;color:#16a34a}
.pill-c{background:#dbeafe;color:#1B3A6B}
.pill-d{background:#f3f4f6;color:#9ca3af}
.tricolor{height:3px;margin:0 20px;background:linear-gradient(90deg,#C8102E 0%,#C9A84C 50%,#1B3A6B 100%);border-radius:2px;position:relative;z-index:2;}
.tricolor.d{background:#d1d5db}
.fields{padding:14px 20px 8px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:2;flex:1;}
.field-block{border-bottom:0.5px solid #f3f4f6;padding-bottom:8px}
.field-label{font-family:'Inter',sans-serif;font-size:7px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#9ca3af;margin-bottom:2px;}
.field-value{font-size:13.5px;font-weight:800;color:#0D2137;line-height:1.2}
.field-value.sm{font-size:11.5px}
.field-value.gray{color:#9ca3af}
.two-col{display:flex;gap:12px}
.two-col .field-block{flex:1}
.badge-footer{background:#0D2137;padding:10px 20px;display:flex;align-items:center;position:relative;z-index:2;margin-top:8px;}
.badge-footer.d{background:#6b7280}
.code-label{font-family:'Inter',sans-serif;font-size:7px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.4);}
.code-val{font-size:13px;font-weight:800;color:#C9A84C;letter-spacing:1.5px;margin-top:1px;}
.code-val.d{color:#d1d5db}
.status-ext{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;padding:5px 16px;border-radius:20px;}
.ext-t{color:#16a34a;background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.2)}
.ext-c{color:#1B3A6B;background:rgba(27,58,107,.08);border:1px solid rgba(27,58,107,.15)}
.ext-d{color:#9ca3af;background:rgba(156,163,175,.1);border:1px solid rgba(156,163,175,.2)}
@media(max-width:400px){.badge{width:260px}}

/* ── IMPRESSÃO ── */
.print-btn {
  margin-top: 12px;
  background: #0D2137;
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: 8px 24px;
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.2s;
}
.print-btn:hover { background: #1B3A6B; }
.print-btn svg { width:14px; height:14px; flex-shrink:0; }

@media print {
  @page {
    size: 8cm 11cm;
    margin: 0;
  }
  html, body {
    width: 8cm;
    height: 11cm;
    margin: 0;
    padding: 0;
    background: #fff !important;
    display: block;
  }
  body { padding: 0 !important; }
  .print-btn { display: none !important; }
  .status-ext { display: none !important; }
  .wrap {
    gap: 0 !important;
    width: 8cm;
    height: 11cm;
    display: block;
  }
  .badge {
    width: 8cm !important;
    height: 11cm !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    overflow: hidden;
    page-break-inside: avoid;
    display: flex;
    flex-direction: column;
  }
  /* Proporcionar escala para caber em 8x11cm */
  .badge-header { padding: 10px 14px 6px 12px !important; }
  .badge-logo { height: 32px !important; }
  .photo-frame { width: 72px !important; height: 72px !important; }
  .photo-initials { font-size: 20px !important; }
  .photo-section { padding: 4px 14px 8px !important; }
  .status-pill { font-size: 6.5px !important; padding: 3px 12px !important; margin-bottom: 7px !important; }
  .tricolor { margin: 0 14px !important; }
  .fields { padding: 8px 14px 4px !important; gap: 6px !important; }
  .field-label { font-size: 6px !important; }
  .field-value { font-size: 11px !important; }
  .field-value.sm { font-size: 9.5px !important; }
  .badge-footer { padding: 7px 14px !important; margin-top: 4px !important; }
  .code-label { font-size: 6px !important; }
  .code-val { font-size: 11px !important; }
  .sail-deco { width: 110px !important; height: 110px !important; }
  .bottom-deco { width: 90px !important; height: 80px !important; }
}
</style>
</head>

const FOTO_PROXY='https://script.google.com/macros/s/AKfycbw1l12xFX0EaKy4JuHNV38mchD2jHl96p4WF-DKk1fAYJf3tcYby06TuFD1pZnSun3w/exec';

const ST=`<svg class="sail-deco" viewBox="0 0 150 150"><polygon points="150,0 150,130 58,0" fill="#1B3A6B"/><polygon points="150,0 150,84 100,0" fill="#C8102E"/><polygon points="150,0 150,44 124,0" fill="#C9A84C"/></svg>`;
const SB=`<svg class="bottom-deco" viewBox="0 0 120 110"><polygon points="0,110 105,110 0,28" fill="#1B3A6B"/><polygon points="0,110 66,110 0,57" fill="#C8102E"/><polygon points="0,110 33,110 0,79" fill="#C9A84C"/></svg>`;
const STG=`<svg class="sail-deco" viewBox="0 0 150 150"><polygon points="150,0 150,130 58,0" fill="#d1d5db"/><polygon points="150,0 150,84 100,0" fill="#e5e7eb"/><polygon points="150,0 150,44 124,0" fill="#f3f4f6"/></svg>`;
const SBG=`<svg class="bottom-deco" viewBox="0 0 120 110"><polygon points="0,110 105,110 0,28" fill="#d1d5db"/><polygon points="0,110 66,110 0,57" fill="#e5e7eb"/><polygon points="0,110 33,110 0,79" fill="#f3f4f6"/></svg>`;

function err(m){document.getElementById('app').innerHTML='<div class="state"><span style="font-size:2rem">⚠️</span><span>'+m+'</span></div>';}
function st(s){if(!s)return'c';const n=s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(n.includes('trabalh'))return't';if(n.includes('deslig'))return'd';return'c';}
const SL={t:'Trabalhando',c:'Cadastrado',d:'Desligado'};
function ini(n){if(!n)return'?';const p=n.trim().split(/\s+/);return p.length===1?p[0].slice(0,2).toUpperCase():(p[0][0]+p[p.length-1][0]).toUpperCase();}
function fd(v){if(!v)return'—';if(typeof v==='string'&&v.startsWith('Date(')){const p=v.replace('Date(','').replace(')','').split(',');return new Date(+p[0],+p[1],+p[2]).toLocaleDateString('pt-BR');}const n=parseFloat(v);if(!isNaN(n))return new Date(Math.round((n-25569)*86400*1000)).toLocaleDateString('pt-BR',{timeZone:'UTC'});return v;}

async function loadFoto(path){
  try{
    const b64=(await(await fetch(FOTO_PROXY+'?file='+encodeURIComponent(path))).text()).trim();
    if(b64.length>200&&/^[A-Za-z0-9+/=]{4}/.test(b64)){
      const img=document.getElementById('bf');const ini=document.getElementById('bi');
      if(img){img.src='data:image/jpeg;base64,'+b64;img.style.display='block';if(ini)ini.style.display='none';}
    }
  }catch(e){}
}

async function load(){
  const id=new URLSearchParams(location.search).get('id');
  if(!id){err('Use: ?id=SEU_ID');return;}
  const q=encodeURIComponent("SELECT * WHERE A='"+id+"'");
  const url='https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?sheet='+TAB+'&tq='+q+'&tqx=out:json';
  try{
    const txt=await(await fetch(url)).text();
    const json=JSON.parse(txt.match(/\{[\s\S]*\}/)[0]);
    if(!json.table||!json.table.rows||!json.table.rows.length){err('Funcionário não encontrado.');return;}
    const c=json.table.rows[0].c;
    const g=(i)=>c[i]&&c[i].v!=null?(c[i].f||String(c[i].v)):'';
    const d={codigo:g(1),funcao:g(2),cadastro:c[3]?fd(c[3].v||c[3].f):'—',nome:g(4),cpf:g(5),rg:g(6),foto:g(10),status:g(12)};
    const s=st(d.status),sl=SL[s],cod=d.codigo?'ATL-'+String(d.codigo).padStart(4,'0'):'—',isD=s==='d';
    const dc=d.cpf&&d.cpf.trim()?`<div class="field-block"><p class="field-label">CPF</p><p class="field-value sm${isD?' gray':''}">${d.cpf}</p></div>`:d.rg&&d.rg.trim()?`<div class="field-block"><p class="field-label">RG</p><p class="field-value sm${isD?' gray':''}">${d.rg}</p></div>`:'';
    document.getElementById('app').innerHTML=`
    <div class="wrap"><div class="badge">
      ${isD?STG:ST}${isD?SBG:SB}
      <div class="badge-header">
        <img class="badge-logo" src="${LOGO}" alt="Atlântico Shopping"${isD?' style="opacity:0.35;filter:grayscale(1)"':''}>
      </div>
      <div class="photo-section"><div class="photo-frame ${s}">
        <img id="bf" style="display:none" alt="${d.nome}">
        <div id="bi" class="photo-initials ${s}">${ini(d.nome)}</div>
      </div></div>
      <span class="status-pill pill-${s}">● ${sl}</span>
      <div class="tricolor${isD?' d':''}"></div>
      <div class="fields">
        <div class="field-block"><p class="field-label">Nome</p><p class="field-value${isD?' gray':''}">${d.nome}</p></div>
        <div class="field-block"><p class="field-label">Função</p><p class="field-value sm${isD?' gray':''}">${d.funcao}</p></div>
        <div class="two-col"><div class="field-block"><p class="field-label">Cadastro</p><p class="field-value sm${isD?' gray':''}">${d.cadastro}</p></div>${dc}</div>
      </div>
      <div class="badge-footer${isD?' d':''}">
        <div><p class="code-label">Código</p><p class="code-val${isD?' d':''}">${cod}</p></div>
      </div>
    </div>
    <span class="status-ext ext-${s}">● ${sl}</span></div>`;
    if(d.foto)loadFoto(d.foto);

    // Botão imprimir
    const btn = document.createElement('button');
    btn.className = 'print-btn';
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Imprimir Crachá`;
    btn.onclick = () => window.print();
    document.querySelector('.wrap').appendChild(btn);
  }catch(e){console.error(e);err('Erro ao carregar dados.');}
}
load();
</script>
