<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crachá Digital — Atlântico Shopping</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #111827;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  padding: 2rem;
}

/* ── LOADING / ERROR ── */
.state-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.2rem;
  color: rgba(255,255,255,0.55);
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,0.12);
  border-top-color: #c9a84c;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-icon { font-size: 2.5rem; }

/* ── CRACHÁ ── */
.badge-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.badge {
  width: 320px;
  background: #ffffff;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,0.55);
}

.badge-header {
  background: #0c0c0c;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.logo-wrap img {
  height: 40px;
  width: auto;
  filter: brightness(0) invert(1);
  display: block;
}

/* Faixa de status */
.stripe { height: 5px; }
.stripe.trabalhando { background: linear-gradient(90deg, #16a34a, #22c55e); }
.stripe.cadastrado  { background: linear-gradient(90deg, #2563eb, #60a5fa); }
.stripe.desligado   { background: linear-gradient(90deg, #dc2626, #f87171); }

/* Corpo */
.badge-body {
  padding: 22px 22px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* Foto / iniciais */
.photo-ring {
  position: relative;
  width: 88px; height: 88px;
  border-radius: 50%;
  padding: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.photo-ring.trabalhando { background: linear-gradient(135deg,#16a34a,#86efac); }
.photo-ring.cadastrado  { background: linear-gradient(135deg,#2563eb,#93c5fd); }
.photo-ring.desligado   { background: linear-gradient(135deg,#dc2626,#fca5a5); }

.photo-inner {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: #f3f4f6;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.photo-inner img {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
.photo-initials {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 26px;
  color: #374151;
  letter-spacing: -1px;
}

/* Pílula de status */
.status-pill {
  position: absolute;
  bottom: -2px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Montserrat', sans-serif;
  font-size: 8.5px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #fff;
  padding: 3px 10px;
  border-radius: 20px;
  white-space: nowrap;
  border: 2px solid #fff;
}
.status-pill.trabalhando { background: #16a34a; }
.status-pill.cadastrado  { background: #2563eb; }
.status-pill.desligado   { background: #dc2626; }

/* Nome e cargo */
.employee-name {
  font-family: 'Montserrat', sans-serif;
  font-size: 17px;
  font-weight: 800;
  color: #111827;
  text-align: center;
  line-height: 1.2;
  letter-spacing: -0.3px;
}
.employee-role {
  font-family: 'Montserrat', sans-serif;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: center;
  margin-top: 3px;
}
.employee-role.trabalhando { color: #16a34a; }
.employee-role.cadastrado  { color: #2563eb; }
.employee-role.desligado   { color: #dc2626; }

/* Meta cards */
.meta-row {
  display: flex;
  gap: 10px;
  width: 100%;
}
.meta-card {
  flex: 1;
  background: #f9fafb;
  border-radius: 10px;
  padding: 8px 10px;
  text-align: center;
}
.mlabel {
  font-family: 'Inter', sans-serif;
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #9ca3af;
  margin-bottom: 2px;
}
.mvalue {
  font-family: 'Montserrat', sans-serif;
  font-size: 11.5px;
  font-weight: 700;
  color: #1f2937;
}

/* Rodapé */
.badge-footer {
  background: #0c0c0c;
  padding: 14px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.codigo-block { display: flex; flex-direction: column; gap: 2px; }
.flabel {
  font-family: 'Inter', sans-serif;
  font-size: 8px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
}
.fvalue {
  font-family: 'Montserrat', sans-serif;
  font-size: 15px;
  font-weight: 800;
  color: #c9a84c;
  letter-spacing: 1px;
}

/* QR box */
.qr-box {
  width: 40px; height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
}
.qr-box.trabalhando { background: rgba(22,163,74,0.25); }
.qr-box.cadastrado  { background: rgba(37,99,235,0.25); }
.qr-box.desligado   { background: rgba(220,38,38,0.25); }
.qr-box svg { width: 100%; height: 100%; }

/* Status label embaixo */
.status-label {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  font-weight: 700;
  padding: 4px 14px;
  border-radius: 20px;
}
.status-label.trabalhando { color: #16a34a; background: rgba(22,163,74,0.12); }
.status-label.cadastrado  { color: #2563eb; background: rgba(37,99,235,0.12); }
.status-label.desligado   { color: #dc2626; background: rgba(220,38,38,0.12); }

/* ── RESPONSIVO ── */
@media (max-width: 400px) {
  .badge { width: 290px; }
}
</style>
</head>

// Lê parâmetro da URL: ?codigo=0010  ou  ?id=37766aa4
function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

// Converte número serial do Excel/Sheets para data brasileira
function serialToDate(serial) {
  if (!serial) return '—';
  const num = parseFloat(serial);
  if (isNaN(num)) {
    // Já é string de data
    const d = new Date(serial);
    if (isNaN(d)) return serial;
    return d.toLocaleDateString('pt-BR');
  }
  // Excel serial: 1 = 01/01/1900
  const date = new Date(Math.round((num - 25569) * 86400 * 1000));
  return date.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
}

// Gera iniciais a partir do nome
function initials(name) {
  if (!name) return '??';
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// Normaliza status para classe CSS
function normalizeStatus(status) {
  if (!status) return 'cadastrado';
  const s = status.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (s.includes('trabalh')) return 'trabalhando';
  if (s.includes('deslig')) return 'desligado';
  return 'cadastrado';
}

// Labels de exibição
const STATUS_LABEL = {
  trabalhando: 'Trabalhando',
  cadastrado:  'Cadastrado',
  desligado:   'Desligado',
};

// QR placeholder SVG
const QR_SVG = `<svg viewBox="0 0 10 10" fill="white" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="3" height="3"/><rect x="6" y="1" width="3" height="3"/>
  <rect x="1" y="6" width="3" height="3"/><rect x="6" y="6" width="1" height="1"/>
  <rect x="8" y="6" width="1" height="1"/><rect x="6" y="8" width="1" height="1"/>
  <rect x="8" y="8" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/>
  <rect x="5" y="5" width="1" height="1"/>
</svg>`;

// Renderiza o crachá com os dados
function renderBadge(data) {
  const status = normalizeStatus(data.status);
  const label  = STATUS_LABEL[status];
  const nome   = (data.nome || '').trim();
  const codigo = data.codigo ? `ATL-${String(data.codigo).padStart(4, '0')}` : '—';
  const funcao = data.funcao || '—';
  const depto  = data.departamento || funcao; // fallback: usa função como depto
  const dtCad  = serialToDate(data.cadastro);
  const foto   = data.foto || '';

  // Foto: URL direta ou iniciais
  let fotoHTML = '';
  if (foto && foto.startsWith('http')) {
    fotoHTML = `<img src="${foto}" alt="${nome}" onerror="this.style.display='none';document.getElementById('ini').style.display='flex'">
                <div class="photo-initials" id="ini" style="display:none">${initials(nome)}</div>`;
  } else {
    fotoHTML = `<div class="photo-initials">${initials(nome)}</div>`;
  }

  // Logo
  const logoHTML = CONFIG.LOGO_URL
    ? `<img src="${CONFIG.LOGO_URL}" alt="Atlântico Shopping">`
    : `<span style="color:#fff;font-family:Montserrat,sans-serif;font-size:13px;font-weight:800;letter-spacing:3px;text-transform:uppercase">ATLÂNTICO SHOPPING</span>`;

  document.getElementById('app').innerHTML = `
    <div class="badge-wrap">
      <div class="badge">

        <div class="badge-header">
          <div class="logo-wrap">${logoHTML}</div>
        </div>

        <div class="stripe ${status}"></div>

        <div class="badge-body">
          <div class="photo-ring ${status}">
            <div class="photo-inner">${fotoHTML}</div>
            <span class="status-pill ${status}">${label}</span>
          </div>

          <div style="text-align:center">
            <p class="employee-name">${nome}</p>
            <p class="employee-role ${status}">${funcao}</p>
          </div>

          <div class="meta-row">
            <div class="meta-card">
              <p class="mlabel">Cadastro</p>
              <p class="mvalue">${dtCad}</p>
            </div>
            <div class="meta-card">
              <p class="mlabel">Departamento</p>
              <p class="mvalue">${depto}</p>
            </div>
          </div>
        </div>

        <div class="badge-footer" ${status === 'desligado' ? 'style="opacity:0.5"' : ''}>
          <div class="codigo-block">
            <p class="flabel">Código do Funcionário</p>
            <p class="fvalue">${codigo}</p>
          </div>
          <div class="qr-box ${status}">${QR_SVG}</div>
        </div>

      </div>
      <span class="status-label ${status}">● ${label}</span>
    </div>`;
}

// Exibe erro
function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="state-screen">
      <span class="error-icon">⚠️</span>
      <span>${msg}</span>
    </div>`;
}

// ── BUSCA NO GOOGLE SHEETS VIA GVIZ ──
async function loadBadge() {
  const idParam = getParam('id');

  if (!idParam) {
    renderError('Parâmetro não informado.<br>Use: ?id=37766aa4');
    return;
  }

  // Monta query GViz — busca pelo ID único gerado pelo AppSheet
  const col   = CONFIG.COLS.id;
  const valor = idParam;
  const query = `SELECT * WHERE ${col} = '${valor}'`;
  const url   = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq`
              + `?sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}`
              + `&tq=${encodeURIComponent(query)}`
              + `&tqx=out:json`;

  try {
    const res  = await fetch(url);
    const text = await res.text();

    // gviz retorna JSONP: /*O_o*/\ngoogle.visualization.Query.setResponse({...});
    const json = JSON.parse(text.replace(/^[^{]+/, '').replace(/\);?\s*$/, ''));

    if (!json.table || !json.table.rows || json.table.rows.length === 0) {
      renderError('Funcionário não encontrado.');
      return;
    }

    // Mapeia colunas pelo label
    const cols = json.table.cols.map(c => c.label);
    const row  = json.table.rows[0].c;

    function val(colName) {
      const i = cols.indexOf(colName);
      return i >= 0 && row[i] ? (row[i].v !== null ? row[i].v : row[i].f || '') : '';
    }

    const data = {
      id:           val(CONFIG.COLS.id),
      codigo:       val(CONFIG.COLS.codigo),
      nome:         val(CONFIG.COLS.nome),
      funcao:       val(CONFIG.COLS.funcao),
      departamento: val(CONFIG.COLS.departamento),
      cadastro:     val(CONFIG.COLS.cadastro),
      foto:         val(CONFIG.COLS.foto),
      status:       val(CONFIG.COLS.status),
    };

    renderBadge(data);

  } catch (err) {
    console.error(err);
    renderError('Erro ao carregar dados da planilha.<br>Verifique o SHEET_ID e as permissões.');
  }
}

loadBadge();
